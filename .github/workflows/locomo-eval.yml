name: External LoCoMo Retrieval Evaluation

on:
  workflow_dispatch:
    inputs:
      max_questions:
        description: "Maximum annotated LoCoMo questions to evaluate; blank evaluates all."
        required: false
        default: "100"
  push:
    branches: [main]
    paths:
      - ".github/workflows/locomo-eval.yml"
      - "app/storage.py"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Download LoCoMo to runner temporary storage
        run: curl --fail --location --silent --show-error https://raw.githubusercontent.com/snap-research/locomo/main/data/locomo10.json --output "$RUNNER_TEMP/locomo10.json"
      - name: Evaluate evidence retrieval
        env:
          MAX_QUESTIONS: ${{ inputs.max_questions }}
        run: |
          if [ -n "$MAX_QUESTIONS" ]; then
            python scripts/evaluate_locomo_retrieval.py --dataset "$RUNNER_TEMP/locomo10.json" --max-questions "$MAX_QUESTIONS" --compare-v020
          else
            python scripts/evaluate_locomo_retrieval.py --dataset "$RUNNER_TEMP/locomo10.json" --compare-v020
          fi
