name: Local Research Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/local-research.yml"
      - "app/local_semantic.py"
      - "Dockerfile.local"
      - "requirements-local.txt"
      - "tests/test_local_instruction.py"
      - "pytest.ini"
  push:
    branches: [main]
    paths:
      - ".github/workflows/local-research.yml"
      - "app/local_semantic.py"
      - "Dockerfile.local"
      - "requirements-local.txt"
      - "tests/test_local_instruction.py"
      - "pytest.ini"

permissions:
  contents: read

jobs:
  dependency-and-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local research dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-local.txt
      - name: Verify imports without model downloads
        env:
          HF_HUB_OFFLINE: "1"
        run: python -c "import fastembed, numpy"
      - name: Run dependency-bound smoke tests
        run: python -m pytest -m local_research
      - name: Build optional local-model Docker image
        run: docker build --file Dockerfile.local --tag chrono-hybrid-mem-local:${{ github.sha }} .
