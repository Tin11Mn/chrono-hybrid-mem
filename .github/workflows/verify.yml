name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run API contract tests
        run: python -m pytest
      - name: Compare released retrieval baseline
        run: python scripts/compare_release_v020.py --cases examples/release_comparison_diagnostic.json
      - name: Build Docker image
        run: docker build --tag chrono-hybrid-mem:${{ github.sha }} .
      - name: Build optional local-model Docker image
        run: docker build --file Dockerfile.local --tag chrono-hybrid-mem-local:${{ github.sha }} .
